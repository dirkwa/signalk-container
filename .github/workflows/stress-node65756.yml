# ─────────────────────────────────────────────────────────────
# Stress harness for nodejs/node#65756 — the intermittent
# Windows child-process crash (0xC0000005) that marks a whole
# test file failed after all of its tests passed.
#
# Runs on pushes to its own branch (workflow_dispatch only
# registers on the default branch); not part of regular CI.
# Repeats the suite N times per matrix leg and classifies each
# run:
#   - main-process exit status captured raw (32-bit) via a
#     spawnSync driver, because bash truncates NTSTATUS codes
#   - child crashes show up as `exitCode:` inside the JUnit
#     failure blob (testCodeFailure), which plain assertion
#     failures (ERR_ASSERTION) never carry
#
# Modes:
#   default — `node --test` over the glob, runner spawns one
#             child per file (the configuration that flakes)
#   none    — whole suite in one process via
#             --test-isolation=none; the suite's known
#             cross-file assertion failures make exit status 1
#             expected, so only a status outside {0,1} counts
#   perfile — the driver itself spawns
#             `node --test --test-isolation=none <file>` per
#             test file: same process churn as `default`, but
#             without the runner's process-isolation path.
#             Distinguishes "many Node starts/stops crash" from
#             "the isolation plumbing is involved".
#   perfile-default
#           — the driver spawns `node --test <file>` per test
#             file: one runner process managing exactly one
#             isolation child. Keeps the isolation path that
#             `perfile` removed, but drops the per-runner child
#             count from ~250 to 1, so a hit here implicates the
#             isolation plumbing itself and a miss implicates
#             the accumulation of many children under one runner.
# ─────────────────────────────────────────────────────────────
name: stress-node65756

on:
  push:
    branches: ["stress-node65756"]
  workflow_dispatch:
    inputs:
      iterations:
        description: Test-suite repetitions per matrix leg
        required: false
        default: "30"
        type: string

jobs:
  stress:
    name: node ${{ matrix.node }} / mode ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "24.19.0"
            mode: perfile-default
          - node: "24.20.0"
            mode: perfile-default
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install

      - run: npm run build:server

      - name: Write spawnSync driver
        run: |
          cat > stress-driver.mjs <<'EOF'
          import { spawnSync } from "node:child_process";
          import { globSync, writeFileSync } from "node:fs";
          const [iter, mode] = process.argv.slice(2);
          if (mode === "perfile" || mode === "perfile-default") {
            // perfile drops the runner's isolation path (child runs the tests
            // directly); perfile-default keeps it, one runner per one child.
            // In perfile-default a crashed child is reported BY its runner, which
            // then exits 1 — indistinguishable from an assertion failure by exit
            // status alone. So the crash signature is read from the runner's own
            // JUnit output instead: only a testCodeFailure carries exitCode/signal.
            const perFileArgs =
              mode === "perfile"
                ? ["--test", "--test-isolation=none"]
                : ["--test", "--test-reporter=junit", "--test-reporter-destination=stdout"];
            const CRASH_RE = /failureType: 'testCodeFailure'[\s\S]*?(exitCode: (?!null)[0-9-]+|signal: '[A-Z]+')/;
            const files = globSync("dist/test/*.test.js").sort();
            const bad = [];
            for (const f of files) {
              const r = spawnSync(process.execPath, [...perFileArgs, f], {
                stdio: ["ignore", "pipe", "pipe"],
              });
              const out = Buffer.concat([
                r.stdout ?? Buffer.alloc(0),
                r.stderr ?? Buffer.alloc(0),
              ]).toString();
              const crashMatch = mode === "perfile-default" ? out.match(CRASH_RE) : null;
              const crashed =
                r.signal !== null ||
                (r.status !== 0 && r.status !== 1) ||
                crashMatch !== null;
              if (r.status !== 0 || r.signal) {
                bad.push({
                  file: f,
                  status: r.status,
                  signal: r.signal,
                  crashed,
                  crashSig: crashMatch ? crashMatch[1] : null,
                });
                const slug = f.replace(/[\\/]/g, "_");
                writeFileSync(
                  `stress-logs/${crashed ? "HIT-" : ""}iter${iter}-${slug}.out.log`,
                  out,
                );
              }
            }
            const hit = bad.some((b) => b.crashed);
            console.log(
              `STRESS_RESULT ${JSON.stringify({ iter: Number(iter), mode, files: files.length, hit, bad })}`,
            );
          } else {
            const args = [
              "--test",
              "--test-concurrency=1",
              "--test-reporter=spec",
              `--test-reporter-destination=stress-logs/run-${iter}.log`,
              "--test-reporter=junit",
              `--test-reporter-destination=stress-logs/run-${iter}.junit.xml`,
            ];
            if (mode === "none") args.push("--test-isolation=none");
            args.push("dist/test/*.test.js");
            const r = spawnSync(process.execPath, args, { stdio: ["inherit", "inherit", "pipe"] });
            if (r.stderr && r.stderr.length) process.stderr.write(r.stderr);
            console.log(
              `STRESS_RESULT ${JSON.stringify({ iter: Number(iter), mode, status: r.status, signal: r.signal, hit: null })}`,
            );
          }
          EOF

      - name: Run suite repeatedly
        run: |
          ITER="${{ inputs.iterations || '30' }}"
          MODE="${{ matrix.mode }}"
          mkdir -p stress-logs
          hits=0
          for i in $(seq 1 "$ITER"); do
            set +e
            out=$(node stress-driver.mjs "$i" "$MODE" 2> "stress-logs/run-$i.stderr.log")
            set -e
            line=$(printf '%s\n' "$out" | grep -o 'STRESS_RESULT {.*}' | sed 's/STRESS_RESULT //' || true)
            if [ -z "$line" ]; then
              echo "iteration $i: DRIVER PRODUCED NO RESULT — counting as hit"
              hit=1
              line="{}"
            else
              hit=$(printf '%s' "$line" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);const h=j.hit!==null?j.hit:(j.status!==0&&j.status!==1);console.log(h?1:0)})")
            fi
            childcodes=$(grep -o 'exitCode: [0-9-]*' "stress-logs/run-$i.junit.xml" 2>/dev/null | sort -u | tr '\n' ' ' || true)
            if [ -n "$childcodes" ]; then hit=1; fi
            echo "iteration $i: $line child-exitCodes=[${childcodes}]"
            if [ "$hit" = "1" ]; then
              hits=$((hits+1))
              cp "stress-logs/run-$i.log" "stress-logs/HIT-run-$i.spec.log" 2>/dev/null || true
              cp "stress-logs/run-$i.junit.xml" "stress-logs/HIT-run-$i.junit.xml" 2>/dev/null || true
              echo "  ^^ HIT (abnormal exit status or child exitCode in junit)"
            fi
          done
          echo "== $hits hit(s) in $ITER runs — node ${{ matrix.node }}, mode $MODE =="
          {
            echo "### node ${{ matrix.node }} / mode $MODE"
            echo ""
            echo "**$hits** hit(s) in **$ITER** runs"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ matrix.node }}-mode-${{ matrix.mode }}
          path: stress-logs/
          retention-days: 30
          if-no-files-found: warn
