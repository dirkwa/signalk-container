name: Publish Package

on:
  push:
    tags:
      - "v*"
  # Re-run a release that the tag push already attempted. A GitHub outage can
  # fail the release step after the tag is pushed, and the tag only fires this
  # workflow once — without a manual trigger the only way back is deleting and
  # re-pushing the tag. Run it from the Actions tab with the tag selected as
  # the ref: every job reads github.ref_name, so a dispatch against v1.2.3
  # behaves exactly like the push that created it.
  #
  # Delete any release the failed attempt left behind first (a half-succeeded
  # attempt can leave a draft), or creating it again will collide.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [[ "$REF" == refs/tags/*-beta.* ]] || [[ "$REF" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        env:
          # Pass github.ref through env, never interpolated into the shell
          # script — a tag name is attacker-controllable and expanding it
          # inline would be a command-injection vector.
          REF: ${{ github.ref }}
