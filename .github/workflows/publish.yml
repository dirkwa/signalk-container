name: Publish Package

on:
  push:
    tags:
      - "v*"
  # Re-run a release that the tag push already attempted. A GitHub outage can
  # fail the release step after the tag is pushed, and the tag only fires this
  # workflow once — without a manual trigger the only way back is deleting and
  # re-pushing the tag. Run it from the Actions tab with the tag selected as
  # the ref: every job reads github.ref_name, so a dispatch against v1.2.3
  # behaves exactly like the push that created it.
  #
  # Delete any release the failed attempt left behind first (a half-succeeded
  # attempt can leave a draft), or creating it again will collide.
  workflow_dispatch:

jobs:
  release:
    # release-please creates the GitHub release for a real version, so only a
    # hand-pushed pre-release tag needs one made here; running for every tag
    # would collide with the release that already exists.
    #
    # A manual run can select any ref, including a branch. Everything here
    # treats the ref as a released version — it becomes the release name and
    # the published package — so a branch dispatch would cut a release called
    # "master" and npm-publish that branch's contents. The tag guard is what
    # keeps the manual trigger to its one purpose: re-running a release whose
    # tag already exists.
    if: ${{ github.ref_type == 'tag' && (contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    # No `needs: release`: that job is pre-release-only now, and a real
    # release must still publish when it is skipped. This job holds
    # `id-token: write` and publishes to npm, so it carries its own guard
    # rather than leaning on another job's condition to stay off a branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Clean workspace
        run: git clean -xfd

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install

      - name: Build
        run: npm run build

      - name: Publish
        run: |
          if [[ "$REF" == refs/tags/*-beta.* ]] || [[ "$REF" == refs/tags/*-rc.* ]]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi
        env:
          # Pass github.ref through env, never interpolated into the shell
          # script — a tag name is attacker-controllable and expanding it
          # inline would be a command-injection vector.
          REF: ${{ github.ref }}
